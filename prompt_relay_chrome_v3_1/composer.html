<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2f9">
  <title>Prompt Relay</title>
  <link rel="stylesheet" href="composer.css">
</head>
<body>
  <main class="app">
<section class="destination-section" aria-label="Choose which AI receives your prompt">
      <div class="section-title-row">
        <div class="section-title">Send to</div>
        <div class="selection-count" id="selection-count">3 selected</div>
      </div>
      <div class="targets">
        <button class="target target-chatgpt selected" type="button" data-target="ChatGPT" aria-pressed="true">
          <span class="target-logo chatgpt-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5a5 5 0 0 0-4.8 3.6 4.7 4.7 0 0 0-2 8.5 4.8 4.8 0 0 0 8.2 4.4 4.8 4.8 0 0 0 5.7-7.2A4.8 4.8 0 0 0 12 3.5Z" stroke="currentColor" stroke-width="1.7"/><path d="m8.2 6.8 7.7 4.4v6.1M4.8 14.4l7.7-4.5 5.3 3M7.3 20v-8.8l5.2-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
          <span class="target-copy"><span class="target-name">ChatGPT</span><span class="target-status">Checking tab…</span></span>
          <span class="target-control" aria-hidden="true"><span></span></span>
        </button>
        <button class="target target-claude selected" type="button" data-target="Claude" aria-pressed="true">
          <span class="target-logo claude-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.8 14.2 9l6.1-2.2-3.7 5.2 4.5 4.4-6.4-.8L12 21.5l-2.7-5.9-6.4.8 4.5-4.4-3.7-5.2L9.8 9 12 2.8Z" fill="currentColor"/></svg></span>
          <span class="target-copy"><span class="target-name">Claude</span><span class="target-status">Checking tab…</span></span>
          <span class="target-control" aria-hidden="true"><span></span></span>
        </button>
        <button class="target target-gemini selected" type="button" data-target="Gemini" aria-pressed="true">
          <span class="target-logo gemini-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5c.9 4.9 4.6 8.6 9.5 9.5-4.9.9-8.6 4.6-9.5 9.5-.9-4.9-4.6-8.6-9.5-9.5 4.9-.9 8.6-4.6 9.5-9.5Z" fill="currentColor"/></svg></span>
          <span class="target-copy"><span class="target-name">Gemini</span><span class="target-status">Checking tab…</span></span>
          <span class="target-control" aria-hidden="true"><span></span></span>
        </button>
      </div>
    </section>

    <section class="activity" aria-live="polite" aria-atomic="false">
      <div id="empty-state" class="empty-state">
        <div class="empty-orb" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 3.5c1.3 6.5 6 11.2 12.5 12.5C22 17.3 17.3 22 16 28.5 14.7 22 10 17.3 3.5 16 10 14.7 14.7 10 16 3.5Z" fill="currentColor"/></svg></div>
        <div class="empty-title">Ready when you are</div>
        <p>Choose your AIs, write a prompt, and send it once.</p>
      </div>
      <div id="last-send" class="last-send hidden">
        <div class="last-send-heading"><span class="activity-label">Latest delivery</span><span id="send-time"></span></div>
        <p id="prompt-preview"></p>
        <div id="result-details" class="result-details"></div>
      </div>
    </section>

    <form id="composer" class="composer" novalidate>
      <div class="drop-overlay" id="drop-overlay" aria-hidden="true"><div class="drop-overlay-inner"><span class="drop-icon">↓</span><strong>Drop files to attach</strong></div></div>
      <div class="composer-heading">
        <div class="input-title"><span class="composer-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 3.8h7l4.2 4.3v12.1H7V3.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 4v4.5h4M9.5 13h6M9.5 16.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span>Message</span></div>
        <span class="composer-caption">Enter to send <span>·</span> Shift + Enter for a new line</span>
      </div>
      <label for="prompt" class="sr-only">Prompt for selected AI websites</label>
      <textarea id="prompt" rows="1" placeholder="Ask a question, share an idea, or describe what you need…" autofocus></textarea>

      <div id="attachment-area" class="attachment-area hidden">
        <div class="attachment-header"><span id="attachment-count">Attachments</span><button class="text-button" id="clear-files" type="button">Remove all</button></div>
        <div id="attachment-list" class="attachment-list"></div>
      </div>

      <div class="composer-footer">
        <div class="footer-left">
          <input id="file-picker" class="sr-only" type="file" multiple>
          <button id="attach-button" class="attach-button" type="button" title="Attach images and files">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m8.8 12.8 6.4-6.4a3.4 3.4 0 0 1 4.8 4.8l-8.8 8.8a5 5 0 0 1-7.1-7.1l8.5-8.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Add files</span>
          </button>
          <span class="file-hint" id="file-hint">Images, PDFs, documents</span>
        </div>
        <button id="send-button" class="send-button" type="submit" disabled>
          <span id="send-label">Send to 3</span>
          <span class="send-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>
    </form>
    <div id="notice" class="notice" role="status"><span class="notice-dot"></span><span id="notice-text">Looking for your open AI tabs…</span></div>
  </main>
  <script src="composer.js"></script>
</body>
</html>
